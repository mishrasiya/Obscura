<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obscura | Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/login.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-brand">
        <span class="auth-brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 5V11C4 16 7.5 19.7 12 21C16.5 19.7 20 16 20 11V5L12 2Z" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M9 11.5L11 13.5L15 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <h1>Obscura</h1>
      </div>

      <p class="auth-tagline">Safe AI conversations. Your data, protected automatically.</p>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" data-tab="login" role="tab" aria-selected="true">Sign in</button>
        <button class="auth-tab" data-tab="register" role="tab" aria-selected="false">Create account</button>
      </div>

      <!-- Login form -->
      <form id="loginForm" class="auth-form" novalidate>
        <div class="field-group">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" name="username"
            autocomplete="username" placeholder="your_username" required />
        </div>
        <div class="field-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password"
            autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <p class="auth-error" id="loginError" hidden></p>
        <button type="submit" class="auth-submit" id="loginBtn">
          <span class="btn-label">Sign in</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Register form -->
      <form id="registerForm" class="auth-form" hidden novalidate>
        <div class="field-group">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" name="username"
            autocomplete="username" placeholder="your_username" required />
          <p class="auth-hint">Letters, numbers, _ and - only. At least 3 characters.</p>
        </div>
        <div class="field-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" name="password"
            autocomplete="new-password" placeholder="••••••••" required />
          <p class="auth-hint">At least 8 characters.</p>
        </div>
        <p class="auth-error" id="regError" hidden></p>
        <button type="submit" class="auth-submit" id="registerBtn">
          <span class="btn-label">Create account</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
